<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManguaBlades - Web3 RPG ⚔️</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #181a20;
            --border-color: #2b2f36;
            --primary: #f0b90b;
            --fire: #ff4d4d;
            --water: #00b8d9;
            --earth: #ffab00;
            --lightning: #6554c0;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #12161c;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary);
        }

        .wallet-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .balance {
            background: #2b2f36;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn-connect {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            background-color: #181a20;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-btn {
            background: none;
            border: none;
            color: #848e9c;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 20px;
            cursor: pointer;
        }

        .nav-btn.active, .nav-btn:hover {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .btn-action {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            position: relative;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card.fire { border-color: var(--fire); }
        .card.water { border-color: var(--water); }

        .element-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .badge-fire { background: var(--fire); color: #fff; }
        .badge-water { background: var(--water); color: #fff; }

        .avatar-placeholder {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #2b2f36;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .stats-list {
            text-align: left;
            margin: 15px 0;
            font-size: 14px;
            color: #eaecef;
        }

        .btn-card {
            width: 100%;
            background: #2b2f36;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-card:hover {
            background: var(--primary);
            color: #000;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MANGUABLADES ⚔️</div>
        <div class="wallet-info">
            <div class="balance">💰 Saldo: <strong>1,250 $MANGUA</strong></div>
            <button class="btn-connect" id="connectWallet">Conectar Web3</button>
        </div>
    </header>

    <nav>
        <button class="nav-btn active" onclick="switchTab('plaza')">🏛️ Plaza</button>
        <button class="nav-btn" onclick="switchTab('herreria')">🔨 Herrería</button>
        <button class="nav-btn" onclick="switchTab('combate')">⚔️ Combate</button>
        <button class="nav-btn" onclick="switchTab('mercado')">🛒 Mercado</button>
    </nav>

    <div class="container">
        <div class="actions-bar">
            <h2>Tus Personajes NFT (2/4)</h2>
            <button class="btn-action">Reclutar Personaje (1,000 $MANGUA)</button>
        </div>

        <div class="grid">
            <div class="card fire">
                <span class="element-badge badge-fire">🔥 Fuego</span>
                <div class="avatar-placeholder">🧑‍🚀</div>
                <h3>Caminante #001</h3>
                <div class="stats-list">
                    <p>⚡ <strong>Poder Base:</strong> 1,280 PWR</p>
                    <p>⭐ <strong>Nivel:</strong> Nivel 2</p>
                    <p>🔋 <strong>Energía:</strong> 200/200</p>
                </div>
                <button class="btn-card">Seleccionar para Batalla</button>
            </div>

            <div class="card water">
                <span class="element-badge badge-water">💧 Agua</span>
                <div class="avatar-placeholder">🛡️</div>
                <h3>Guardian #002</h3>
                <div class="stats-list">
                    <p>⚡ <strong>Poder Base:</strong> 1,050 PWR</p>
                    <p>⭐ <strong>Nivel:</strong> Nivel 1</p>
                    <p>🔋 <strong>Energía:</strong> 160/200</p>
                </div>
                <button class="btn-card">Seleccionar para Batalla</button>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            alert("Navegando a la sección: " + tabName.toUpperCase());
        }
    </script>
</body>
  </html>
